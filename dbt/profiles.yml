# Safe to commit: every secret comes from an environment variable.
# Run dbt from the dbt/ folder with:  dbt debug --profiles-dir .
# (or set DBT_PROFILES_DIR to this folder once and drop the flag)
olist:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      private_key_passphrase: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PASSPHRASE', '') }}"
      role: TRANSFORMER
      warehouse: OLIST_WH
      database: OLIST
      schema: DBT_DEV          # dev models land in DBT_DEV_STAGING, DBT_DEV_MARTS, ...
      threads: 4

    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      private_key_passphrase: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PASSPHRASE', '') }}"
      role: TRANSFORMER
      warehouse: OLIST_WH
      database: OLIST
      schema: MARTS            # models land in STAGING, INTERMEDIATE, MARTS exactly
      threads: 4

    ci:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      private_key_passphrase: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PASSPHRASE', '') }}"
      role: TRANSFORMER
      warehouse: OLIST_WH
      database: OLIST
      schema: "{{ env_var('DBT_CI_SCHEMA', 'CI') }}"   # GitHub Actions sets e.g. CI_PR_12
      threads: 4
